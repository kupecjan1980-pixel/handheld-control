<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handheld Control</title>
<style>
  /* Steam Quick Access look: dark panel, 16px gutters, fields with a separator. */
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0e141b; color: #dcdedf;
    font-family: "Motiva Sans", "Noto Sans", system-ui, sans-serif; font-size: 14px; }
  body { display: flex; flex-direction: column; max-width: 420px; margin: 0 auto; }
  #title { flex: none; padding: 14px 16px 10px; background: #0e141b; }
  .staticclasses_Title_d1 { font-size: 22px; font-weight: 700; color: #fff; }
  #scroller { flex: 1; min-height: 0; overflow-y: auto; }
  #scroller::-webkit-scrollbar { display: none; }
  .hhc-section { padding: 6px 16px 10px; }
  .quickaccesscontrols_PanelSectionTitle_d1 { font-size: 13px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; color: #b8bcbf; padding: 8px 0 4px; }
  .gamepaddialog_Field_d1 { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.1); }
  .hhc-field-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .gamepaddialog_FieldLabel_d1 { font-size: 15px; color: #fff; }
  .gamepaddialog_FieldChildren_d1 { flex: none; color: #dcdedf; }
  .gamepaddialog_FieldDescription_d1 { font-size: 12px; color: #8b929a; margin-top: 4px; line-height: 1.35; }
  .gamepaddialog_Toggle_d1 { position: relative; width: 44px; height: 22px; border: 0; padding: 0;
    background: transparent; cursor: pointer; }
  .gamepaddialog_ToggleRail_d1 { position: absolute; inset: 0; border-radius: 11px; background: #3d4450; }
  .gamepaddialog_On_d1 .gamepaddialog_ToggleRail_d1 { background: #1a9fff; }
  .gamepaddialog_ToggleSwitch_d1 { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
    border-radius: 9px; background: #b8bcbf; transition: left .12s; }
  .gamepaddialog_On_d1 .gamepaddialog_ToggleSwitch_d1 { left: 24px; background: #fff; }
  .gamepaddialog_Toggle_d1:disabled { opacity: .4; cursor: default; }
  .gamepadslider_SliderControl_d1 { padding: 8px 0 2px; }
  .gamepadslider_SliderTrack_d1 { -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
    border-radius: 3px; outline: none; cursor: pointer;
    background: linear-gradient(to right, #1a9fff 0, #1a9fff calc(var(--normalized-slider-value) * 100%),
      #3d4450 calc(var(--normalized-slider-value) * 100%), #3d4450 100%); }
  .gamepadslider_SliderTrack_d1::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px;
    border-radius: 9px; background: #fff; border: 0; }
  .DialogButton_d1 { background: #3d4450; color: #fff; border: 0; border-radius: 3px; font: inherit; cursor: pointer; }
  .DialogButton_d1:hover:not(:disabled) { background: #4a5260; }
  .DialogButton_d1:disabled { opacity: .45; cursor: default; }
  .hhc-button { width: 100%; padding: 9px 12px; }
  .hhc-select { padding: 6px 8px; max-width: 190px; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .hhc-toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #23262e;
    color: #fff; padding: 10px 14px; border-radius: 6px; box-shadow: 0 4px 20px rgba(0,0,0,.5); z-index: 99; }
  #error { display: none; padding: 16px; color: #ffb35c; }
</style>
</head>
<body>
  <div id="title"></div>
  <div id="scroller"><div id="panel"></div></div>
  <div id="error"></div>
  <script>
    const show = (msg) => {
      const el = document.getElementById("error");
      el.style.display = "block";
      el.textContent = "Panel error: " + msg;
    };
    addEventListener("error", (e) => show(e.message));
    addEventListener("unhandledrejection", (e) => show(e.reason && (e.reason.stack || e.reason.message) || e.reason));
  </script>
  <script src="bundle.js"></script>
</body>
</html>
