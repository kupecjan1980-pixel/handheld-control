<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HHC Desktop</title>
<style>
  :root { color-scheme: dark; --bg: #0e141b; --side: #121922; --line: rgba(255,255,255,.08); --dim: #8b929a; --accent: #1a9fff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #dcdedf;
    font-family: "Motiva Sans", "Noto Sans", system-ui, sans-serif; font-size: 14px; }
  #app, .app { height: 100%; }
  .app { display: flex; }
  button { font: inherit; color: inherit; }

  /* Sidebar: devices with live mini graphs, like Mission Center */
  .side { flex: none; width: 270px; background: var(--side); border-right: 1px solid var(--line); overflow-y: auto; padding: 10px 8px 20px; }
  .side::-webkit-scrollbar { width: 6px; } .side::-webkit-scrollbar-thumb { background: #2a313b; border-radius: 3px; }
  .brand { font-size: 17px; font-weight: 700; color: var(--accent); padding: 6px 10px 10px; }
  .side-group { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); padding: 12px 10px 4px; }
  .side-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0;
    border-radius: 6px; padding: 7px 10px; cursor: pointer; }
  .side-item:hover { background: rgba(255,255,255,.04); }
  .side-item.on { background: rgba(255,255,255,.08); box-shadow: inset 3px 0 0 var(--accent); }
  .side-graph { flex: none; width: 78px; }
  .side-graph .g { border-radius: 3px; }
  .side-text { display: flex; flex-direction: column; min-width: 0; }
  .side-label { color: #fff; font-size: 14px; }
  .side-detail { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Pages */
  .main { flex: 1; min-width: 0; overflow-y: auto; }
  .page { padding: 18px 24px 30px; max-width: 1400px; }
  .page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 12px; }
  .page h1 { margin: 0; font-size: 26px; color: #fff; font-weight: 600; }
  .page-sub { color: var(--dim); margin-top: 2px; }
  .page-value { font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .page h2 { font-size: 14px; color: #fff; font-weight: 600; margin: 18px 0 6px; }
  .loading { padding: 24px; color: var(--dim); }

  .g-wrap { position: relative; }
  .g { display: block; width: 100%; background: rgba(0,0,0,.28); border: 1px solid var(--line); border-radius: 4px; box-sizing: border-box; }
  .g-grid { stroke: rgba(255,255,255,.06); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .g-top, .g-bottom { position: absolute; left: 6px; font-size: 11px; color: var(--dim); pointer-events: none; }
  .g-top { top: 4px; } .g-bottom { bottom: 4px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
  .seg button { background: none; border: 0; padding: 5px 12px; cursor: pointer; color: var(--dim); }
  .seg button.on { background: rgba(255,255,255,.1); color: #fff; }
  .cores { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 12px; }
  .core-label { font-size: 12px; color: #b8bcbf; font-variant-numeric: tabular-nums; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px 20px; margin: 18px 0 0; }
  .stats dt { font-size: 12px; color: var(--dim); }
  .stats dd { margin: 2px 0 0; font-size: 16px; color: #fff; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; margin: 4px 0; }
  .bar > div { height: 100%; border-radius: 4px; }
  .compose { display: flex; height: 26px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; margin-top: 10px; }
  .legend { display: flex; gap: 16px; font-size: 12px; margin-top: 6px; }
  .fs { margin: 6px 0 12px; max-width: 700px; }
  .fs-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .fs-top span:last-child { color: var(--dim); white-space: nowrap; }
  .search { width: 100%; max-width: 360px; box-sizing: border-box; padding: 8px 10px; margin-bottom: 10px; background: rgba(0,0,0,.3);
    border: 1px solid var(--line); border-radius: 6px; color: #fff; font: inherit; }
  .search:focus { outline: none; border-color: var(--accent); }
  .table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .table th { text-align: left; color: var(--dim); font-weight: normal; padding: 6px 8px; border-bottom: 1px solid var(--line);
    cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--bg); }
  .table th.sorted { color: var(--accent); }
  .table td { padding: 5px 8px; border-bottom: 1px solid rgba(255,255,255,.04); white-space: nowrap; max-width: 380px;
    overflow: hidden; text-overflow: ellipsis; }
  .table tr:hover td { background: rgba(255,255,255,.03); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .dim { color: var(--dim); }
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .chip { background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .chip h2 { margin: 2px 0 6px; }
  .sensor { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; }
  .foot { margin-top: 24px; font-size: 12px; color: #5c6370; }

  /* Controls: the plugin's own panel (Steam Quick Access look), centered */
  .controls { display: flex; flex-direction: column; height: 100%; max-width: 480px; margin: 0 auto; }
  .controls-title { flex: none; padding: 14px 16px 10px; }
  .controls-scroll { flex: 1; min-height: 0; overflow-y: auto; }
  .controls-scroll::-webkit-scrollbar { display: none; }
  .staticclasses_Title_d1 { font-size: 22px; font-weight: 700; color: #fff; }
  .hhc-section { padding: 6px 16px 10px; }
  .quickaccesscontrols_PanelSectionTitle_d1 { font-size: 13px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; color: #b8bcbf; padding: 8px 0 4px; }
  .gamepaddialog_Field_d1 { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.1); }
  .hhc-field-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .gamepaddialog_FieldLabel_d1 { font-size: 15px; color: #fff; }
  .gamepaddialog_FieldChildren_d1 { flex: none; color: #dcdedf; }
  .gamepaddialog_FieldDescription_d1 { font-size: 12px; color: var(--dim); margin-top: 4px; line-height: 1.35; }
  .gamepaddialog_Toggle_d1 { position: relative; width: 44px; height: 22px; border: 0; padding: 0; background: transparent; cursor: pointer; }
  .gamepaddialog_ToggleRail_d1 { position: absolute; inset: 0; border-radius: 11px; background: #3d4450; }
  .gamepaddialog_On_d1 .gamepaddialog_ToggleRail_d1 { background: #1a9fff; }
  .gamepaddialog_ToggleSwitch_d1 { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 9px;
    background: #b8bcbf; transition: left .12s; }
  .gamepaddialog_On_d1 .gamepaddialog_ToggleSwitch_d1 { left: 24px; background: #fff; }
  .gamepaddialog_Toggle_d1:disabled { opacity: .4; cursor: default; }
  .gamepadslider_SliderControl_d1 { padding: 8px 0 2px; }
  .gamepadslider_SliderTrack_d1 { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 3px; outline: none;
    cursor: pointer; background: linear-gradient(to right, #1a9fff 0, #1a9fff calc(var(--normalized-slider-value) * 100%),
      #3d4450 calc(var(--normalized-slider-value) * 100%), #3d4450 100%); }
  .gamepadslider_SliderTrack_d1::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 9px; background: #fff; border: 0; }
  .DialogButton_d1 { background: #3d4450; color: #fff; border: 0; border-radius: 3px; font: inherit; cursor: pointer; }
  .DialogButton_d1:hover:not(:disabled) { background: #4a5260; }
  .DialogButton_d1:disabled { opacity: .45; cursor: default; }
  .hhc-button { width: 100%; padding: 9px 12px; }
  .hhc-select { padding: 6px 8px; max-width: 190px; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .hhc-toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #23262e; color: #fff;
    padding: 10px 14px; border-radius: 6px; box-shadow: 0 4px 20px rgba(0,0,0,.5); z-index: 99; }
  #error { display: none; position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px; color: #ffb35c; background: #1a1d24; z-index: 98; }

  @media (max-width: 760px) { .side { width: 200px; } .side-graph { display: none; } }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="error"></div>
  <script>
    const show = (msg) => {
      const el = document.getElementById("error");
      el.style.display = "block";
      el.textContent = "Error: " + msg;
    };
    addEventListener("error", (e) => show(e.message));
    addEventListener("unhandledrejection", (e) => show(e.reason && (e.reason.stack || e.reason.message) || e.reason));
  </script>
  <script src="bundle.js"></script>
</body>
</html>
